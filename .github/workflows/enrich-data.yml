name: AI Data Enrichment

on:
  schedule:
    # Run every Sunday at 2am UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual trigger from Actions tab

jobs:
  enrich-data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run enrichment agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run agent:enrich

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push suggestions
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.name 'AI Agent Bot'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add api/data/enrichment-suggestions.json
          git commit -m "chore: AI data enrichment suggestions"
          git push
